
stages:
  - test
  - build

variables:
  VID: $VID
  DEBIAN_FRONTEND: noninteractive
  APT_CACHE_DIR: apt-cache
  SRC_DIR: test/resources/dnf/p5
  YEARS: "12 15"
  SAXON_HOME: "$CI_PROJECT_DIR/lib"

build-and-test-i5:
  stage: test
  image: rocker/verse
  artifacts:
    paths:
      - "target/dnf??.i5.xml"
      - "target/*.zip"
  cache:
    - key: DNB4KorAP
      paths:
          - apt-cache/

  before_script:
    - source `find .. -name section_helper.sh`
    - mkdir -p "$SAXON_HOME"
    - start_section saxon_license_debug "Preparing Saxon license"
    - |
      echo "SAXON_HOME=$SAXON_HOME"
      echo "SAXON_LICENSE=$SAXON_LICENSE"
      ls -l "$SAXON_HOME" || true
      ls -l "$SAXON_LICENSE" || true
      if [ -r "$SAXON_LICENSE" ]; then
        echo "SAXON_LICENSE readable: yes"
        cp -v "$SAXON_LICENSE" "$SAXON_HOME/saxon-license.lic" && ls -l "$SAXON_HOME/saxon-license.lic"
      else
        echo "SAXON_LICENSE readable: no"
        echo "No readable SAXON_LICENSE file variable present"
      fi
    - end_section saxon_license_debug
    - start_section install_linux_packages "Installing missing Linux packages"
    - apt-get -o dir::cache::archives="$APT_CACHE_DIR" update
    - apt-get -o dir::cache::archives="$APT_CACHE_DIR" install -y libxml2-utils curl unzip openjdk-17-jre-headless xmlstarlet
    - end_section install_linux_packages
    - start_section install_models "Installing models"
    - make models/dereko_domains_s.classifier
    - end_section install_models

  script:
    - start_section checking_i5 "Building and testing I5 files"
    - make -j $(nproc) test
    - end_section checking_i5


build-index:
  image: eclipse-temurin:21-jdk
  services:
    - docker:dind
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_JOB_MANUAL == "true"'
  variables:
      VID: $CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA
      KRILL_INDEXER_HEAP: 8g
  cache:
    - key: DNB4KorAP
      paths:
          - apt-cache/
    - key:
        files:
          - target/dnf15.i5.xml
      paths:
          - target/dnf15.zip
          - target/dnf15.tree_tagger.zip
          - target/dnf15.marmot-malt.zip
          - target/dnf15.spacy.zip
          - target/dnf15.krill.tar

  before_script:
    - source `find .. -name section_helper.sh`
    - mkdir -p "$SAXON_HOME"
    - start_section saxon_license_debug "Preparing Saxon license"
    - |
      echo "SAXON_HOME=$SAXON_HOME"
      echo "SAXON_LICENSE=$SAXON_LICENSE"
      ls -l "$SAXON_HOME" || true
      ls -l "$SAXON_LICENSE" || true
      if [ -r "$SAXON_LICENSE" ]; then
        echo "SAXON_LICENSE readable: yes"
        cp -v "$SAXON_LICENSE" "$SAXON_HOME/saxon-license.lic" && ls -l "$SAXON_HOME/saxon-license.lic"
      else
        echo "SAXON_LICENSE readable: no"
        echo "No readable SAXON_LICENSE file variable present"
      fi
    - end_section saxon_license_debug
    - start_section install_linux_packages "Installing missing Linux packages"
    - mkdir -pv $APT_CACHE_DIR
    - apt-get -o dir::cache::archives="$APT_CACHE_DIR" update
    - apt-get -o dir::cache::archives="$APT_CACHE_DIR" install -y libxml2-utils pv curl unzip docker.io
    - end_section install_linux_packages

  script:
    - start_section building_index "Building index"
    - touch target/*.zip # ignore timestamps in make
    - sleep 1
    - touch target/*.*.zip
    - MAX_THREADS=2 make -j $(nproc) target/dnf.index.tar.xz
    - end_section building_index
  artifacts:
    paths:
      - target/*.zip
      - target/dnf.index.tar.xz
